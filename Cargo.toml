[package]
name = "account-sponsor"
description = "Sponsors creation of NEAR accounts (named, implicit, NEP-616 deterministic, NEP-655 universal) for wallet connectors, callable through a public function-call access key"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NEAR-DevHub/near-account-sponsor"

[lib]
crate-type = ["cdylib", "rlib"]

# fields to configure build with WASM reproducibility, according to specs
# in https://github.com/near/NEPs/blob/master/neps/nep-0330.md
[package.metadata.near.reproducible_build]
# docker image, descriptor of build environment
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
# tag after colon above serves only descriptive purpose; image is identified by digest
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
# list of environment variables names, whose values, if set, will be used as external build parameters
# in a reproducible manner
# supported by `sourcescan/cargo-near:0.10.1-rust-1.82.0` image or later images
passed_env = []
# build command inside of docker container
# if docker image from default gallery is used https://hub.docker.com/r/sourcescan/cargo-near/tags,
# the command may be any combination of flags of `cargo-near`,
# supported by respective version of binary inside the container besides `--no-locked` flag
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = { version = "5.30.1", features = ["deterministic-account-ids", "universal-accounts"] }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["deterministic-account-ids", "universal-accounts", "unit-testing"] }
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"

[workspace]
members = ["registrar-mock"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
